syntax = "proto3";

package mergiate.v1;

option go_package = "github.com/akordium-id/mergiate-core/gen/mergiate/v1;mergiatev1";

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string version = 2;
  int64 timestamp = 3;
}
